# BusyChat 反向代理示例（TLS 终止 + WebSocket + 登录限流）
# 放置到 /etc/nginx/conf.d/busychat.conf（http {} 上下文内）。
# 上游保持 127.0.0.1:3000，应用只监听回环，避免绕过代理直连。

# WebSocket Upgrade 头映射
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 登录限流：每 IP 每分钟 5 次；应用自身也有按 IP 的登录锁定作为兜底。
limit_req_zone $binary_remote_addr zone=busychat_login:10m rate=5r/m;

server {
    listen 80;
    server_name busychat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name busychat.example.com;

    ssl_certificate     /etc/letsencrypt/live/busychat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/busychat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:busychat_tls:10m;
    ssl_session_timeout 1d;

    # 配置 JSON / 静态资源上传留出余量；按需调整。
    client_max_body_size 10m;

    # 反向 WebSocket 路径（runtime.onebot.webSocket.reversePath 的默认值）。
    location /onebot/ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebUI 登录：额外的边缘限流（应用内部还有锁定策略）。
    location = /api/login {
        limit_req zone=busychat_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WebUI、API、健康检查与 OneBot HTTP 事件入口。
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 重要：反向代理运行时，应用必须设置 BUSYCHAT_TRUST_PROXY=1（或
# config.json 的 settings.trustProxy: true），否则应用看到的是 127.0.0.1，
# 登录限流/审计会失效。反之，直连部署必须保持 0，防止伪造 X-Forwarded-For。
